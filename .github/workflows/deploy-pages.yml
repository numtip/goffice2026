# Preview deployment only — production remains on goffice.mju.ac.th (manual VPS).
# windows-latest: NTFS supports long paths; the FY2568 published evidence tree
# contains 4 filenames/path components > 255 bytes that cannot be checked out
# on Linux (ext4) runners, and Git-for-Windows GNU tar rejects them at archive
# time, so the Pages artifact is created with Windows bsdtar (libarchive).
name: Deploy GitHub Pages Preview

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build site
        run: npm run build
        env:
          DEPLOY_TARGET: github-pages
          PUBLIC_PREVIEW_BADGE: "true"
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Validate platform
        run: npm run validate
        env:
          DEPLOY_TARGET: github-pages
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: SEO QA
        run: npm run qa:seo

  build:
    runs-on: windows-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build site
        run: npm run build
        env:
          DEPLOY_TARGET: github-pages
          PUBLIC_PREVIEW_BADGE: "true"

      - name: Archive artifact
        shell: pwsh
        run: |
          # Windows bsdtar (libarchive) handles the >255-byte FY2568 paths that
          # Git-for-Windows GNU tar rejects ("File removed before we read it").
          & "$env:SystemRoot\System32\tar.exe" -L -cf "$env:RUNNER_TEMP\artifact.tar" -C dist .

      - name: Upload Pages artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: windows-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
