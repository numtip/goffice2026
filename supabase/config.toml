# Supabase local development — Green Office 2026
# Managed in-repo for GO-INFRA-1 / GO-BE-3. Apply migrations via `supabase db reset`.

project_id = "goffice2026"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:4321"
additional_redirect_urls = ["http://127.0.0.1:4321"]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false
